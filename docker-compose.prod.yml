services:
  server:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    image: "${ECR_REPO_URL}:${IMAGE_TAG}"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 5000
    command: sh -c "./node_modules/.bin/prisma migrate deploy && exec node index.js"
    expose:
      - "5000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5000/').then(r => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  client:
    image: "${CLIENT_ECR_REPO_URL}:${IMAGE_TAG}"
    depends_on:
      server:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "80:80"
    restart: unless-stopped

