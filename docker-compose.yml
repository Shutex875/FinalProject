services:
  server:
    build: ./server
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/dev.db
      - PORT=5000
      - CLIENT_URL=http://13.38.76.64:3000
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_ISSUER=ExtremeGearShop
      - JWT_AUDIENCE=client
      - JWT_EXPIRES_IN=15m
    volumes:
      - ./server/dev.db:/app/dev.db
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  client:
    build: ./client
    ports:
      - "3000:80"
    volumes:
      - ./client/public/images:/usr/share/nginx/html/images
    depends_on:
      - server
    environment:
      - REACT_APP_API_URL=/api
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "3"
