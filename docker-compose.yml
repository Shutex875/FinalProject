version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: finalproject-postgres-1
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  server:
    build: ./server
    container_name: finalproject-server
    env_file:
      - .env
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=${DATABASE_URL}
      - PORT=5000
      - CLIENT_URL=http://localhost:3000
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_ISSUER=ExtremeGearShop
      - JWT_AUDIENCE=client
      - JWT_EXPIRES_IN=15m
    depends_on:
      - postgres
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  client:
    build: ./client
    container_name: finalproject-client-1
    ports:
      - "3000:80"
    depends_on:
      - server
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
