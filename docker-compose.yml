services:
  server:
    build: ./server
    container_name: finalproject-server
    env_file:
      - .env
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - PORT=5000
      - CLIENT_URL=http://13.38.76.64
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_ISSUER=ExtremeGearShop
      - JWT_AUDIENCE=client
      - JWT_EXPIRES_IN=15m
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  client:
    image: nginx:alpine
    container_name: finalproject-client-1
    ports:
      - "3000:80"
    volumes:
      - ./client/build:/usr/share/nginx/html
      - ./client/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped