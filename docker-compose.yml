services:
  server:
    build: ./server
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "5000"
      CLIENT_URL: http://localhost:3000
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  client:
    build: ./client
    ports:
      - "3000:80"
    depends_on:
      - server
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"