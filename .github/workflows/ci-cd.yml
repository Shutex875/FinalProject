name: Enterprise CI/CD

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' || !contains(fromJSON('["main","master"]'), github.ref_name) }}

jobs:
  terraform-check:
    name: Terraform validation and security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra/terraform

      - name: Validate application infrastructure
        working-directory: infra/terraform
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Validate backend bootstrap module
        working-directory: infra/terraform/bootstrap
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - uses: terraform-linters/setup-tflint@v4

      - name: Run TFLint
        working-directory: infra/terraform
        run: |
          tflint --init
          tflint --recursive

      - name: Scan Terraform configuration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: infra/terraform
          scanners: misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
          trivyignores: .trivyignore,infra/terraform/.trivyignore

  backend-check:
    name: Backend and database checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Validate Prisma schema
        working-directory: server
        env:
          DATABASE_URL: postgresql://ci_user:ci_password@127.0.0.1:5432/ci_db
        run: |
          npx prisma validate
          npx prisma generate

      - name: Check JavaScript syntax
        run: |
          find server -type f -name '*.js' -not -path '*/node_modules/*' -print0 \
            | xargs -0 -r -n1 node --check

      - name: Lint backend JavaScript
        run: |
          find server -type f -name '*.js' -not -path '*/node_modules/*' -print0 \
            | xargs -0 -r npx --yes eslint@8.57.1 --no-eslintrc --env es2022,node \
                --parser-options '{"sourceType":"module","ecmaVersion":"latest"}' \
                --rule 'no-unreachable:error' --rule 'valid-typeof:error' \
                --rule 'no-constant-condition:error'

  frontend-check:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Lint frontend
        working-directory: client
        run: npx eslint src

      - name: Run frontend tests
        working-directory: client
        env:
          CI: 'true'
        run: npm test -- --watchAll=false --passWithNoTests

      - name: Build frontend
        working-directory: client
        env:
          CI: 'true'
          GENERATE_SOURCEMAP: 'false'
          REACT_APP_API_URL: /api
        run: npm run build

  release:
    name: Build, publish, provision, and deploy
    needs: [terraform-check, backend-check, frontend-check]
    if: >-
      (github.event_name == 'push' && contains(fromJSON('["main","master"]'), github.ref_name)) ||
      (github.event_name == 'workflow_dispatch' && contains(fromJSON('["main","master"]'), github.ref_name))
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: production-release
      cancel-in-progress: false
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-3' }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      PROJECT_NAME: ${{ vars.PROJECT_NAME }}

      ENVIRONMENT: ${{ vars.ENVIRONMENT || 'development' }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_KEY: ${{ vars.TF_STATE_KEY || 'terraform.tfstate' }}
      TF_LOCK_TABLE: ${{ vars.TF_LOCK_TABLE }}
      ARTIFACTS_BUCKET: ${{ vars.ARTIFACTS_BUCKET }}
      IMAGE_TAG: ${{ github.sha }}
      RDS_HOST: ${{ vars.RDS_HOST }}
      RDS_DB_NAME: ${{ vars.RDS_DB_NAME }}
      CLIENT_URL: ${{ vars.CLIENT_URL }}
      RDS_USERNAME: ${{ secrets.RDS_USERNAME }}
      RDS_PASSWORD: ${{ secrets.RDS_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
      TF_VAR_project_name: ${{ vars.PROJECT_NAME }}
      TF_VAR_environment: ${{ vars.ENVIRONMENT || 'development' }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION || 'eu-west-3' }}
      TF_VAR_db_password: ${{ secrets.RDS_PASSWORD }}
      TF_VAR_image_tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false

      - name: Validate release configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in AWS_ROLE_ARN PROJECT_NAME TF_STATE_BUCKET TF_LOCK_TABLE ARTIFACTS_BUCKET \
                      RDS_HOST RDS_DB_NAME CLIENT_URL RDS_USERNAME RDS_PASSWORD JWT_SECRET JWT_REFRESH_SECRET; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required GitHub variable or secret: $name" >&2
              exit 1
            fi
          done

      - name: Configure AWS credentials using GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Initialize remote Terraform backend
        working-directory: infra/terraform
        shell: bash
        run: |
          set -euo pipefail
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${TF_LOCK_TABLE}" \
            -backend-config="encrypt=true"
          terraform validate

      - name: Ensure ECR repositories exist and are managed by Terraform
        working-directory: infra/terraform
        shell: bash
        run: |
          set -euo pipefail
          ensure_repository() {
            local repository_name="$1"
            local terraform_address="$2"
            if terraform state list | grep -Fxq "$terraform_address"; then
              return
            fi
            if ! aws ecr describe-repositories --repository-names "$repository_name" --region "$AWS_REGION" >/dev/null 2>&1; then
              aws ecr create-repository \
                --repository-name "$repository_name" \
                --image-tag-mutability IMMUTABLE \
                --image-scanning-configuration scanOnPush=true \
                --region "$AWS_REGION" >/dev/null
            fi
            terraform import -input=false "$terraform_address" "$repository_name"
          }
          ensure_repository "${PROJECT_NAME}-${ENVIRONMENT}-server" aws_ecr_repository.server
          ensure_repository "${PROJECT_NAME}-${ENVIRONMENT}-client" aws_ecr_repository.client

      - name: Ensure artifacts bucket exists before publishing manifests
        working-directory: infra/terraform
        shell: bash
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          expected_bucket="${PROJECT_NAME}-${ENVIRONMENT}-artifacts-${account_id}"
          if [[ "$ARTIFACTS_BUCKET" != "$expected_bucket" ]]; then
            echo "ARTIFACTS_BUCKET must match the Terraform bucket name: $expected_bucket" >&2
            exit 1
          fi

          if ! aws s3api head-bucket --bucket "$ARTIFACTS_BUCKET" --region "$AWS_REGION" 2>/dev/null; then
            if [[ "$AWS_REGION" == us-east-1 ]]; then
              aws s3api create-bucket --bucket "$ARTIFACTS_BUCKET" --region "$AWS_REGION" >/dev/null
            else
              aws s3api create-bucket --bucket "$ARTIFACTS_BUCKET" --region "$AWS_REGION" \
                --create-bucket-configuration "LocationConstraint=${AWS_REGION}" >/dev/null
            fi
          fi

          aws s3api put-public-access-block --bucket "$ARTIFACTS_BUCKET" --region "$AWS_REGION" \
            --public-access-block-configuration BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
          aws s3api put-bucket-versioning --bucket "$ARTIFACTS_BUCKET" --region "$AWS_REGION" \
            --versioning-configuration Status=Enabled
          aws s3api put-bucket-encryption --bucket "$ARTIFACTS_BUCKET" --region "$AWS_REGION" \
            --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'

          if ! terraform state list | grep -Fxq 'aws_s3_bucket.artifacts'; then
            terraform import -input=false aws_s3_bucket.artifacts "$ARTIFACTS_BUCKET"
          fi

      - name: Resolve ECR repositories from Terraform state
        id: ecr
        working-directory: infra/terraform
        shell: bash
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          registry="${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          echo "server_url=${registry}/${PROJECT_NAME}-${ENVIRONMENT}-server" >> "$GITHUB_OUTPUT"
          echo "client_url=${registry}/${PROJECT_NAME}-${ENVIRONMENT}-client" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Check whether this SHA is already published
        id: image-state
        shell: bash
        env:
          SERVER_REPOSITORY: ${{ steps.ecr.outputs.server_url }}
          CLIENT_REPOSITORY: ${{ steps.ecr.outputs.client_url }}
        run: |
          set -euo pipefail
          server_name="${SERVER_REPOSITORY##*/}"
          client_name="${CLIENT_REPOSITORY##*/}"
          if aws ecr describe-images --repository-name "$server_name" --image-ids "imageTag=${IMAGE_TAG}" --region "$AWS_REGION" >/dev/null 2>&1; then
            echo 'server_exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'server_exists=false' >> "$GITHUB_OUTPUT"
          fi
          if aws ecr describe-images --repository-name "$client_name" --image-ids "imageTag=${IMAGE_TAG}" --region "$AWS_REGION" >/dev/null 2>&1; then
            echo 'client_exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'client_exists=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push server image for linux/amd64
        if: steps.image-state.outputs.server_exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./server
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ecr.outputs.server_url }}:${{ github.sha }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

      - name: Build and push client image for linux/amd64
        if: steps.image-state.outputs.client_exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./client
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ecr.outputs.client_url }}:${{ github.sha }}
          cache-from: type=gha,scope=client
          cache-to: type=gha,mode=max,scope=client

      - name: Render and upload production release manifests
        shell: bash
        env:
          ECR_REPO_URL: ${{ steps.ecr.outputs.server_url }}
          CLIENT_ECR_REPO_URL: ${{ steps.ecr.outputs.client_url }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gettext-base
          release_dir="${RUNNER_TEMP}/release-${IMAGE_TAG}"
          mkdir -p "$release_dir/current"
          export ECR_REPO_URL CLIENT_ECR_REPO_URL IMAGE_TAG
          envsubst < docker-compose.prod.yml > "$release_dir/docker-compose.prod.yml"
          cp deploy.sh "$release_dir/deploy.sh"
          cp "$release_dir/docker-compose.prod.yml" "$release_dir/current/"
          cp deploy.sh "$release_dir/current/"

          node <<'NODE'
          const fs = require('node:fs');
          const encode = (value) => encodeURIComponent(value).replace(/[!'()*]/g, (c) => `%${c.charCodeAt(0).toString(16).toUpperCase()}`);
          const quote = (value) => `"${String(value).replaceAll('\\', '\\\\').replaceAll('"', '\\"').replaceAll('\n', '\\n')}"`;
          const dbUrl = `postgresql://${encode(process.env.RDS_USERNAME)}:${encode(process.env.RDS_PASSWORD)}@${process.env.RDS_HOST}:5432/${process.env.RDS_DB_NAME}?sslmode=require`;
          const values = {
            NODE_ENV: 'production', PORT: '5000', DATABASE_URL: dbUrl,
            JWT_SECRET: process.env.JWT_SECRET,
            JWT_REFRESH_SECRET: process.env.JWT_REFRESH_SECRET,
            CLIENT_URL: process.env.CLIENT_URL,
            JWT_ISSUER: 'ExtremeGearShop', JWT_AUDIENCE: 'client', JWT_EXPIRES_IN: '15m'
          };
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/release-${process.env.IMAGE_TAG}/.env`,
            Object.entries(values).map(([k, v]) => `${k}=${quote(v)}`).join('\n') + '\n', { mode: 0o600 });
          NODE
          cp "$release_dir/.env" "$release_dir/current/.env"

          release_prefix="s3://${ARTIFACTS_BUCKET}/${PROJECT_NAME}/${ENVIRONMENT}/config"
          aws s3 cp "$release_dir/docker-compose.prod.yml" "${release_prefix}/releases/${IMAGE_TAG}/docker-compose.prod.yml" --sse AES256
          aws s3 cp "$release_dir/deploy.sh" "${release_prefix}/releases/${IMAGE_TAG}/deploy.sh" --sse AES256
          aws s3 cp "$release_dir/.env" "${release_prefix}/releases/${IMAGE_TAG}/.env" --sse AES256
          aws s3 cp "$release_dir/current/docker-compose.prod.yml" "${release_prefix}/current/docker-compose.prod.yml" --sse AES256
          aws s3 cp "$release_dir/current/deploy.sh" "${release_prefix}/current/deploy.sh" --sse AES256
          aws s3 cp "$release_dir/current/.env" "${release_prefix}/current/.env" --sse AES256

      - name: Apply Terraform and obtain EC2 instance ID
        id: terraform-apply
        working-directory: infra/terraform
        shell: bash
        run: |
          set -euo pipefail
          terraform apply -input=false -auto-approve -var "image_tag=$IMAGE_TAG"
          instance_id="$(terraform output -raw instance_id)"
          [[ "$instance_id" =~ ^i-[0-9a-f]+$ ]] || { echo "Invalid Terraform instance_id output: $instance_id" >&2; exit 1; }
          echo "instance_id=$instance_id" >> "$GITHUB_OUTPUT"

      - name: Deploy through AWS Systems Manager
        shell: bash
        env:
          INSTANCE_ID: ${{ steps.terraform-apply.outputs.instance_id }}
        run: |
          set -euo pipefail
          online=false
          for attempt in $(seq 1 60); do
            ping_status="$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=${INSTANCE_ID}" \
              --region "$AWS_REGION" \
              --query 'InstanceInformationList[0].PingStatus' \
              --output text)"
            if [[ "$ping_status" == Online ]]; then
              online=true
              break
            fi
            echo "Waiting for SSM agent on ${INSTANCE_ID} (${attempt}/60): ${ping_status}"
            sleep 10
          done
          [[ "$online" == true ]] || { echo "EC2 instance did not become available through SSM." >&2; exit 1; }

          release_prefix="s3://${ARTIFACTS_BUCKET}/${PROJECT_NAME}/${ENVIRONMENT}/config/releases/${IMAGE_TAG}"
          remote_command="install -d -m 0750 /opt/app && aws s3 cp '${release_prefix}/deploy.sh' /opt/app/deploy.sh --region '${AWS_REGION}' && chmod 750 /opt/app/deploy.sh && ARTIFACTS_BUCKET='${ARTIFACTS_BUCKET}' AWS_REGION='${AWS_REGION}' PROJECT_NAME='${PROJECT_NAME}' ENVIRONMENT='${ENVIRONMENT}' /opt/app/deploy.sh '${IMAGE_TAG}'"
          parameters="$(jq -n --arg command "$remote_command" '{commands:[$command]}')"
          command_id="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "$parameters" \
            --timeout-seconds 600 \
            --region "$AWS_REGION" \
            --query 'Command.CommandId' \
            --output text)"
          echo "SSM command $command_id dispatched to $INSTANCE_ID"

          deadline=$((SECONDS + 720))
          until aws ssm wait command-executed \
              --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" \
              --region "$AWS_REGION"; do
            status="$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query 'Status' \
              --output text 2>/dev/null || true)"
            case "$status" in
              Failed|Cancelled|TimedOut|DeliveryTimedOut|ExecutionTimedOut)
                aws ssm get-command-invocation \
                  --command-id "$command_id" \
                  --instance-id "$INSTANCE_ID" \
                  --region "$AWS_REGION" \
                  --query 'StandardErrorContent' \
                  --output text >&2 || true
                exit 1
                ;;
            esac
            if (( SECONDS >= deadline )); then
              echo "Timed out waiting for SSM deployment command $command_id (last status: $status)." >&2
              exit 1
            fi
          done

          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --region "$AWS_REGION" \
            --query 'StandardOutputContent' \
            --output text
